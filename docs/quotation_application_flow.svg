<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
  <defs>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #173126; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #587264; }
      .section { font: 700 20px Arial, sans-serif; fill: #173126; }
      .label { font: 600 16px Arial, sans-serif; fill: #173126; }
      .small { font: 400 14px Arial, sans-serif; fill: #2e4b3d; }
      .box { fill: #ffffff; stroke: #94b8a3; stroke-width: 2; rx: 18; ry: 18; }
      .boxSoft { fill: #f7fbf8; stroke: #c8ddd0; stroke-width: 2; rx: 18; ry: 18; }
      .boxGreen { fill: #eaf7ef; stroke: #5ea176; stroke-width: 2; rx: 18; ry: 18; }
      .boxBlue { fill: #eef6fb; stroke: #7ba7bf; stroke-width: 2; rx: 18; ry: 18; }
      .boxAmber { fill: #fff8e8; stroke: #d2b15d; stroke-width: 2; rx: 18; ry: 18; }
      .arrow { stroke: #426554; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .dash { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#426554" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1320" fill="#eef7f2" />

  <text x="900" y="56" text-anchor="middle" class="title">Quotation Application Flow Diagram</text>
  <text x="900" y="84" text-anchor="middle" class="subtitle">Vendor registration, approval, quotation, vendor QR/OTP response, comparison, and final selection flow</text>

  <rect x="60" y="130" width="1680" height="150" class="boxSoft"/>
  <text x="90" y="166" class="section">1. Master Setup</text>

  <rect x="90" y="188" width="180" height="64" class="box"/>
  <text x="180" y="226" text-anchor="middle" class="label">Stakeholder</text>
  <text x="180" y="245" text-anchor="middle" class="small">Category Setup</text>

  <rect x="290" y="188" width="180" height="64" class="box"/>
  <text x="380" y="226" text-anchor="middle" class="label">Registration</text>
  <text x="380" y="245" text-anchor="middle" class="small">Types</text>

  <rect x="490" y="188" width="180" height="64" class="box"/>
  <text x="580" y="226" text-anchor="middle" class="label">Firm Types</text>
  <text x="580" y="245" text-anchor="middle" class="small">and Documents</text>

  <rect x="690" y="188" width="180" height="64" class="box"/>
  <text x="780" y="226" text-anchor="middle" class="label">Themes</text>
  <text x="780" y="245" text-anchor="middle" class="small">and Units</text>

  <rect x="890" y="188" width="180" height="64" class="box"/>
  <text x="980" y="226" text-anchor="middle" class="label">Approval</text>
  <text x="980" y="245" text-anchor="middle" class="small">Channels</text>

  <rect x="1090" y="188" width="180" height="64" class="box"/>
  <text x="1180" y="226" text-anchor="middle" class="label">Employee</text>
  <text x="1180" y="245" text-anchor="middle" class="small">Masters</text>

  <rect x="1290" y="188" width="180" height="64" class="box"/>
  <text x="1380" y="226" text-anchor="middle" class="label">Menu</text>
  <text x="1380" y="245" text-anchor="middle" class="small">Permissions</text>

  <rect x="1490" y="188" width="180" height="64" class="box"/>
  <text x="1580" y="226" text-anchor="middle" class="label">Users Login</text>
  <text x="1580" y="245" text-anchor="middle" class="small">Access Control</text>

  <rect x="60" y="320" width="520" height="360" class="boxSoft"/>
  <text x="90" y="356" class="section">2. Vendor Registration Flow</text>

  <rect x="110" y="390" width="180" height="70" class="box"/>
  <text x="200" y="420" text-anchor="middle" class="label">Create Vendor</text>
  <text x="200" y="442" text-anchor="middle" class="small">registration form</text>

  <rect x="110" y="510" width="180" height="82" class="box"/>
  <text x="200" y="540" text-anchor="middle" class="label">Fill Details</text>
  <text x="200" y="562" text-anchor="middle" class="small">firm, contact,</text>
  <text x="200" y="580" text-anchor="middle" class="small">location, docs, bank</text>

  <rect x="350" y="390" width="180" height="70" class="box"/>
  <text x="440" y="420" text-anchor="middle" class="label">Send For</text>
  <text x="440" y="442" text-anchor="middle" class="small">Approval</text>

  <rect x="350" y="510" width="180" height="82" class="boxAmber"/>
  <text x="440" y="540" text-anchor="middle" class="label">Approval</text>
  <text x="440" y="562" text-anchor="middle" class="small">pending / return /</text>
  <text x="440" y="580" text-anchor="middle" class="small">reject / approve</text>

  <rect x="215" y="620" width="200" height="70" class="boxGreen"/>
  <text x="315" y="651" text-anchor="middle" class="label">Approved Vendor</text>
  <text x="315" y="672" text-anchor="middle" class="small">available for quotations</text>

  <line x1="200" y1="460" x2="200" y2="510" class="arrow"/>
  <line x1="290" y1="425" x2="350" y2="425" class="arrow"/>
  <line x1="440" y1="460" x2="440" y2="510" class="arrow"/>
  <line x1="350" y1="620" x2="350" y2="620" class="arrow"/>
  <line x1="440" y1="592" x2="350" y2="620" class="arrow"/>
  <line x1="315" y1="620" x2="315" y2="620" class="arrow"/>

  <rect x="640" y="320" width="560" height="520" class="boxSoft"/>
  <text x="670" y="356" class="section">3. Quotation Proposal Flow</text>

  <rect x="690" y="390" width="200" height="74" class="box"/>
  <text x="790" y="420" text-anchor="middle" class="label">Create Quotation</text>
  <text x="790" y="442" text-anchor="middle" class="small">theme, subject, date</text>

  <rect x="950" y="390" width="200" height="74" class="box"/>
  <text x="1050" y="420" text-anchor="middle" class="label">Select Vendors</text>
  <text x="1050" y="442" text-anchor="middle" class="small">approved vendors only</text>

  <rect x="690" y="500" width="200" height="86" class="box"/>
  <text x="790" y="530" text-anchor="middle" class="label">Add Proposal Items</text>
  <text x="790" y="552" text-anchor="middle" class="small">item name, unit,</text>
  <text x="790" y="570" text-anchor="middle" class="small">qty, remark</text>

  <rect x="950" y="500" width="200" height="86" class="box"/>
  <text x="1050" y="530" text-anchor="middle" class="label">Add Committee</text>
  <text x="1050" y="552" text-anchor="middle" class="small">members / levels</text>

  <rect x="820" y="630" width="200" height="74" class="box"/>
  <text x="920" y="660" text-anchor="middle" class="label">Save Proposal</text>
  <text x="920" y="682" text-anchor="middle" class="small">draft created</text>

  <rect x="820" y="740" width="200" height="74" class="boxAmber"/>
  <text x="920" y="770" text-anchor="middle" class="label">Send For Approval</text>
  <text x="920" y="792" text-anchor="middle" class="small">approval request flow</text>

  <line x1="890" y1="427" x2="950" y2="427" class="arrow"/>
  <line x1="790" y1="464" x2="790" y2="500" class="arrow"/>
  <line x1="1050" y1="464" x2="1050" y2="500" class="arrow"/>
  <line x1="890" y1="548" x2="950" y2="548" class="arrow"/>
  <line x1="920" y1="586" x2="920" y2="630" class="arrow"/>
  <line x1="920" y1="704" x2="920" y2="740" class="arrow"/>

  <rect x="1260" y="320" width="480" height="320" class="boxSoft"/>
  <text x="1290" y="356" class="section">4. Approval / Committee Flow</text>

  <rect x="1310" y="400" width="170" height="72" class="boxAmber"/>
  <text x="1395" y="431" text-anchor="middle" class="label">Pending at</text>
  <text x="1395" y="452" text-anchor="middle" class="small">approver / committee</text>

  <rect x="1520" y="400" width="170" height="72" class="box"/>
  <text x="1605" y="431" text-anchor="middle" class="label">Return / Reject</text>
  <text x="1605" y="452" text-anchor="middle" class="small">back to creator</text>

  <rect x="1415" y="520" width="170" height="72" class="boxGreen"/>
  <text x="1500" y="551" text-anchor="middle" class="label">Approved</text>
  <text x="1500" y="572" text-anchor="middle" class="small">ready for vendors</text>

  <line x1="1020" y1="777" x2="1310" y2="436" class="arrow"/>
  <line x1="1480" y1="436" x2="1520" y2="436" class="arrow"/>
  <line x1="1500" y1="472" x2="1500" y2="520" class="arrow"/>

  <rect x="60" y="730" width="660" height="520" class="boxSoft"/>
  <text x="90" y="766" class="section">5. Vendor QR / OTP / Response Flow</text>

  <rect x="120" y="830" width="180" height="72" class="boxBlue"/>
  <text x="210" y="861" text-anchor="middle" class="label">Send To Vendors</text>
  <text x="210" y="882" text-anchor="middle" class="small">SMS link generated</text>

  <rect x="370" y="830" width="180" height="72" class="boxBlue"/>
  <text x="460" y="861" text-anchor="middle" class="label">Vendor Opens</text>
  <text x="460" y="882" text-anchor="middle" class="small">QR / short link</text>

  <rect x="120" y="950" width="180" height="72" class="boxBlue"/>
  <text x="210" y="981" text-anchor="middle" class="label">Send OTP</text>
  <text x="210" y="1002" text-anchor="middle" class="small">mobile verification</text>

  <rect x="370" y="950" width="180" height="72" class="boxBlue"/>
  <text x="460" y="981" text-anchor="middle" class="label">Verify OTP</text>
  <text x="460" y="1002" text-anchor="middle" class="small">secure form access</text>

  <rect x="120" y="1070" width="180" height="84" class="box"/>
  <text x="210" y="1100" text-anchor="middle" class="label">Fill Quotation</text>
  <text x="210" y="1122" text-anchor="middle" class="small">rate, GST, remark</text>
  <text x="210" y="1140" text-anchor="middle" class="small">item-wise</text>

  <rect x="370" y="1070" width="180" height="84" class="box"/>
  <text x="460" y="1100" text-anchor="middle" class="label">Fill T&amp;C</text>
  <text x="460" y="1122" text-anchor="middle" class="small">payment, completion,</text>
  <text x="460" y="1140" text-anchor="middle" class="small">warranty, EMD</text>

  <rect x="560" y="950" width="120" height="204" class="boxGreen"/>
  <text x="620" y="1010" text-anchor="middle" class="label">Submit</text>
  <text x="620" y="1032" text-anchor="middle" class="label">Response</text>
  <text x="620" y="1072" text-anchor="middle" class="small">final vendor</text>
  <text x="620" y="1090" text-anchor="middle" class="small">quotation saved</text>

  <line x1="300" y1="866" x2="370" y2="866" class="arrow"/>
  <line x1="210" y1="902" x2="210" y2="950" class="arrow"/>
  <line x1="300" y1="986" x2="370" y2="986" class="arrow"/>
  <line x1="210" y1="1022" x2="210" y2="1070" class="arrow"/>
  <line x1="460" y1="1022" x2="460" y2="1070" class="arrow"/>
  <line x1="550" y1="1112" x2="560" y2="1112" class="arrow"/>
  <line x1="300" y1="1112" x2="560" y2="1112" class="arrow"/>

  <rect x="800" y="900" width="940" height="350" class="boxSoft"/>
  <text x="830" y="936" class="section">6. Comparison and Final Vendor Selection</text>

  <rect x="850" y="1010" width="180" height="82" class="box"/>
  <text x="940" y="1040" text-anchor="middle" class="label">Committee Compare</text>
  <text x="940" y="1062" text-anchor="middle" class="small">all vendor responses</text>
  <text x="940" y="1080" text-anchor="middle" class="small">side by side</text>

  <rect x="1090" y="1010" width="180" height="82" class="box"/>
  <text x="1180" y="1040" text-anchor="middle" class="label">Committee Score</text>
  <text x="1180" y="1062" text-anchor="middle" class="small">vendor scoring</text>

  <rect x="1330" y="1010" width="180" height="82" class="box"/>
  <text x="1420" y="1040" text-anchor="middle" class="label">Rank Vendors</text>
  <text x="1420" y="1062" text-anchor="middle" class="small">best score / price</text>

  <rect x="1570" y="1010" width="120" height="82" class="boxGreen"/>
  <text x="1630" y="1040" text-anchor="middle" class="label">Select</text>
  <text x="1630" y="1062" text-anchor="middle" class="small">Final Vendor</text>

  <rect x="1090" y="1130" width="420" height="74" class="boxGreen"/>
  <text x="1300" y="1160" text-anchor="middle" class="label">Final Status / Notifications / Printable Vendor Response</text>
  <text x="1300" y="1182" text-anchor="middle" class="small">workflow ends with selected vendor and saved quotation response</text>

  <line x1="1030" y1="1051" x2="1090" y2="1051" class="arrow"/>
  <line x1="1270" y1="1051" x2="1330" y2="1051" class="arrow"/>
  <line x1="1510" y1="1051" x2="1570" y2="1051" class="arrow"/>
  <line x1="1630" y1="1092" x2="1510" y2="1130" class="arrow"/>

  <line x1="620" y1="1010" x2="850" y2="1010" class="arrow"/>
  <line x1="1500" y1="592" x2="210" y2="830" class="arrow dash"/>

  <text x="150" y="1285" class="small">Note: Current business rule is approved vendors only are selectable in quotation proposal, quotation approval is required before vendor dispatch, and OTP verification is required before vendor response entry.</text>
</svg>
